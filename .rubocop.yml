require: rubocop-rspec

Rails:
  Enabled: true

AllCops:
  TargetRubyVersion: 2.4
  DisplayCopNames: true

  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'vendor/bundle/**/*'

Metrics/BlockLength:
  ExcludedMethods:
    - describe
    - context
    - shared_examples_for
  Exclude:
    - Guardfile

# Seems to be breaking tests when recommended fixes for this cop are applied
Rails/HttpPositionalArguments:
  Enabled: false

# FactoryBot 5+ removed static attributes; block syntax is now required.
# This cop predates that change and recommends the removed syntax.
FactoryBot/StaticAttributeDefinedDynamically:
  Enabled: false

Style/Documentation:
  Enabled: false

RSpec/NestedGroups:
  Max: 7

Style/MixinUsage:
  Exclude:
    - bin/*

Style/FrozenStringLiteralComment:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - spec/smoke/**/*_spec.rb

RSpec/MultipleExpectations:
  Exclude:
    - spec/smoke/**/*_spec.rb

RSpec/ExampleLength:
  Exclude:
    - spec/smoke/**/*_spec.rb

Metrics/ClassLength:
  Exclude:
    - scripts/help_text.rb
