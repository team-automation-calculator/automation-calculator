plugins:
  - rubocop-capybara
  - rubocop-factory_bot
  - rubocop-rails
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 4.0
  NewCops: disable
  DisplayCopNames: true
  # rubocop-rake / rubocop-rspec_rails are not adopted; silence the nag.
  SuggestExtensions: false

  Exclude:
    - 'db/schema.rb'
    - 'db/migrate/**/*'
    - 'vendor/bundle/**/*'
    # Generated verbatim by `rails app:update`; kept as Rails ships it so it
    # can be diffed against future upgrades.
    - 'config/initializers/new_framework_defaults_*.rb'

Metrics/BlockLength:
  AllowedMethods:
    - describe
    - context
    - shared_examples_for
  Exclude:
    - Guardfile
    # Environment files are one configure block by design.
    - config/environments/*.rb

# Seems to be breaking tests when recommended fixes for this cop are applied
Rails/HttpPositionalArguments:
  Enabled: false

Style/Documentation:
  Enabled: false

RSpec/NestedGroups:
  Max: 7

# Existing specs reference `subject` directly; renaming them adds churn
# without behavior benefit.
RSpec/NamedSubject:
  Enabled: false

# Existing specs predate this cop; restructuring their let blocks adds churn
# without behavior benefit.
RSpec/MultipleMemoizedHelpers:
  Enabled: false

Style/MixinUsage:
  Exclude:
    - bin/*

Style/FrozenStringLiteralComment:
  Enabled: false

# Do not force Ruby 3.1 hash value shorthand; accept both styles
Style/HashSyntax:
  EnforcedShorthandSyntax: either

# The SolutionPair specs name the two members of a pair solution1/solution2
# (and their initial_cost1/iteration_cost2 inputs); renaming them adds churn
# without behavior benefit.
RSpec/IndexedLet:
  Enabled: false

# The smoke helper `validate_schema!` and `FactoryBot.lint` raise on failure;
# they are the expectation of their examples. (The cop only pattern-matches
# receiver-less calls, so the FactoryBot one needs a file exclusion.)
RSpec/NoExpectationExample:
  AllowedPatterns:
    - ^expect_
    - ^assert_
    - ^validate_schema!$
  Exclude:
    - spec/factories_lint_spec.rb

RSpec/DescribeClass:
  Exclude:
    - spec/smoke/**/*_spec.rb

# Smoke specs deliberately fail fast inside `let` with a message that includes
# the HTTP response, so every example in the chain reports the same cause.
RSpec/ExpectInLet:
  Exclude:
    - spec/smoke/**/*_spec.rb

RSpec/MultipleExpectations:
  Exclude:
    - spec/smoke/**/*_spec.rb

RSpec/ExampleLength:
  Exclude:
    - spec/smoke/**/*_spec.rb

Metrics/ClassLength:
  Exclude:
    - scripts/help_text.rb
