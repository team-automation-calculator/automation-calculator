# Ruby CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/language-ruby/ for more details
#
# Three jobs run in parallel on every branch, each on a Linux VM (machine
# executor) with its own Docker daemon, so there is no setup_remote_docker
# step:
#
#   verify            arm64  CI image build, RuboCop, RSpec
#   build_prod_arm64  arm64  production image build
#   build_prod_amd64  amd64  production image build
#
# arm64 is the architecture the EKS worker nodes are moving to (core-iac
# PR #406, "arm64 worker node migration plan"), so lint and tests run there.
#
# The production image is published as one multi-arch manifest
# (linux/amd64 + linux/arm64). Each half is built on a runner of its own
# architecture: nothing is emulated. Cross-building the amd64 half under
# QEMU on the arm64 runner took about 29 minutes per main build (bundle
# install alone ran 16 minutes emulated against under 2 native).
#
# On main each build_prod job pushes its image to Docker Hub untagged, by
# digest only, and publish_manifest then joins the two digests into one
# manifest carrying :latest and the semver tag. publish_manifest waits for
# all three jobs, so no tag moves unless lint, tests and both image builds
# passed.
#
version: 2.1

commands:
  # ./go is a Ruby script that only shells out to docker, so any Ruby 3+ on
  # the host will do; the app's own Ruby (.ruby-version, 4.0.9) runs inside
  # the Docker images. The machine image manages Ruby with rbenv, whose shim
  # reads .ruby-version from the checkout and exits 1 because that version
  # is not installed on the host. Pin the host to the image's global Ruby
  # for every later step via BASH_ENV, and print the toolchain and
  # architecture so the build log shows what ran.
  use_host_ruby:
    steps:
      - run:
          name: Use the machine image's Ruby for ./go and show the toolchain
          command: |
            echo "export RBENV_VERSION=$(rbenv global)" >> "$BASH_ENV"
            source "$BASH_ENV"
            uname -m && ruby --version && docker version && docker buildx version

  docker_hub_login:
    steps:
      - run:
          name: Login to Docker Hub
          command: docker login --username $DOCKER_HUB_USER --password $DOCKER_HUB_PASSWORD

jobs:
  verify:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium

    environment:
      USER: "circleci"

    working_directory: ~/repo

    steps:
      - checkout
      - use_host_ruby

      # build test image to test (native arm64)
      - run:
          name: ./go build ci
          command: ./go build ci

      # lint
      - run:
          name: ./go lint ci
          command: ./go lint ci

      # run tests!
      - run:
          name: ./go test ci
          command: ./go test ci

  # Builds the production image natively for the runner's architecture.
  # Branches only prove that Dockerfile.production builds; nothing is
  # published. main pushes the image by digest, with no tag, and hands the
  # digest to publish_manifest through the workspace.
  build_prod:
    parameters:
      resource_class:
        type: string

    machine:
      image: ubuntu-2404:current
    resource_class: << parameters.resource_class >>

    environment:
      USER: "circleci"

    working_directory: ~/repo

    steps:
      - checkout
      - use_host_ruby

      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: ./go build prod
                command: ./go build prod

      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - docker_hub_login

            # An untagged push cannot match ^\d+\.\d+\.\d+-\d+$, so core-iac
            # opens no deploy bump PR for it.
            - run:
                name: ./go push prod --digest-only
                command: ./go push prod --digest-only

            - persist_to_workspace:
                root: .
                paths:
                  - tmp/digests

  # main only (see the workflow filter). Tags the two per-architecture
  # images as one multi-arch manifest: :latest and the semver tag (SEMVER_*
  # + this job's CIRCLE_BUILD_NUM, computed in scripts/docker_hub.rb).
  # core-iac opens a deploy bump PR for every tag matching
  # ^\d+\.\d+\.\d+-\d+$, so this is the only step that may create one.
  publish_manifest:
    machine:
      image: ubuntu-2404:current
    resource_class: arm.medium

    environment:
      USER: "circleci"

    working_directory: ~/repo

    steps:
      - checkout
      - use_host_ruby
      - attach_workspace:
          at: .
      - docker_hub_login
      - run:
          name: ./go push prod --manifest
          command: ./go push prod --manifest

workflows:
  build_verify_push:
    jobs:
      - verify
      - build_prod:
          name: build_prod_arm64
          resource_class: arm.medium
      - build_prod:
          name: build_prod_amd64
          resource_class: medium
      - publish_manifest:
          requires:
            - verify
            - build_prod_arm64
            - build_prod_amd64
          filters:
            branches:
              only: main
