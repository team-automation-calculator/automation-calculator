# Ruby CircleCI 2.1 configuration file
#
# Check https://circleci.com/docs/language-ruby/ for more details
#
version: 2.1
jobs:
  build_verify_push:
    docker:
      - image: cimg/ruby:3.4-node

    environment:
      USER: "circleci"

    working_directory: ~/repo

    steps:
      - checkout

      - setup_remote_docker

      # build test image to test, create semver tag
      - run:
          name: ./go build ci
          command: ./go build ci

      # lint
      - run:
          name: ./go lint ci
          command: ./go lint ci

      # run tests!
      - run:
          name: ./go test ci
          command: ./go test ci

      # build prod image if tests pass
      - run:
          name: ./go build prod
          command: ./go build prod

      # Publishing is gated to main. Every branch above verifies that the
      # production image builds; only main gives it a semver tag, moves
      # :latest and pushes to Docker Hub. Branch builds must never publish a
      # tag matching ^\d+\.\d+\.\d+-\d+$, because core-iac opens a deploy
      # bump PR for every such tag.
      - when:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            # tag image with semver (uses this job's CIRCLE_BUILD_NUM)
            - run:
                name: ./go tag
                command: ./go tag

            # login to docker hub in preparation for pushing image
            - run:
                name: Login to Docker Hub
                command: docker login --username $DOCKER_HUB_USER --password $DOCKER_HUB_PASSWORD

            - run:
                name: Upload Docker image to Docker Hub
                command: ./go push

      - unless:
          condition:
            equal: [main, << pipeline.git.branch >>]
          steps:
            - run:
                name: Skip Docker Hub publish (not main)
                command: echo "Branch ${CIRCLE_BRANCH} is not main; skipping ./go tag, Docker Hub login and ./go push."

workflows:
  build_verify_push:
    jobs:
      - build_verify_push
